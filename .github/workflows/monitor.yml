name: LaMajole Monitor

on:
  schedule:
    - cron: '*/30 5-20 * * *'   # every 30 min, roughly 07:00-23:00 Romania time
  workflow_dispatch:

concurrency:
  group: lamajole-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run monitor
        run: python3 monitor.py
        env:
          NOTIFY_EMAIL: ioanacmuresan@gmail.com
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      - name: Save what we have seen
        run: |
          git config user.name "lamajole-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen pieces" && git push)
